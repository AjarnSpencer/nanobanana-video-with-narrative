<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0f172a" />
  
  <!-- Outer Video Frame -->
  <rect x="14" y="16" width="72" height="52" rx="8" fill="none" stroke="url(#screenGrad)" stroke-width="3.5" />
  
  <!-- Nanobanana Icon (Stylized Golden Curve) -->
  <path d="M 32 30 C 45 26, 68 34, 70 54 C 64 54, 48 46, 32 30 Z" fill="url(#bananaGrad)" />
  <!-- Stem -->
  <path d="M 32 30 C 28 32, 26 36, 25 38 C 26 36, 29 32, 33 29 Z" fill="#65a30d" />
  
  <!-- Center Play Badge -->
  <polygon points="46,38 58,45 46,52" fill="#ffffff" opacity="0.9" />

  <!-- Narrative Sound Waves -->
  <line x1="22" y1="78" x2="22" y2="86" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
  <line x1="30" y1="74" x2="30" y2="90" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
  <line x1="38" y1="71" x2="38" y2="93" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="46" y1="76" x2="46" y2="88" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="54" y1="69" x2="54" y2="95" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="62" y1="73" x2="62" y2="91" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="70" y1="75" x2="70" y2="89" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" />
  <line x1="78" y1="79" x2="78" y2="85" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" />
</svg>
